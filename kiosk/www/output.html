<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>VideoBooth</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>
  html,body{margin:0;height:100%;background:#000;overflow:hidden;cursor:none}
  #out{position:fixed;inset:0;width:100vw;height:100vh;background:#000;display:block}
  #cam,#cv{position:fixed;left:-9999px;top:0}
</style></head>
<body>
<!--
  VideoBooth output-only page for Engine B (StreamDiffusion realtime-img2img demo).
  What the visitor screen shows: the generated video, nothing else. The page holds the camera
  (getUserMedia, auto-granted by the kiosk Chromium flags), feeds the demo's websocket the
  way its own UI does (server says "send_frame" → we answer "next_frame" + params + one JPEG),
  and displays /api/stream/<uuid> (multipart MJPEG) full-screen — decoded by hand and drawn on a
  canvas: an <img> fed by multipart MJPEG paints each new part at its natural 512x768 size for one
  frame before object-fit re-applies (a quarter-size flash on every frame, seen on kxkm-ai2
  2026-09-11). Reconnects by itself when the engine restarts. The technician drives the look from the demo UI on a laptop (its
  sliders act on the shared pipeline) — never "Start Stream" there.

  URL parameters (all optional):
    server=http://127.0.0.1:7860   engine base URL (default: 127.0.0.1:7860)
    w=512&h=768                    JPEG we send = generation size (match the yaml)
    cam=<label substring>          pick a camera by label (default: first camera)
    fit=cover|contain              how the output fills the panel (default cover)
    mirror=1|0                     mirror the output like a mirror would (default 1)
    q=0.85                         JPEG quality of the frames we send
-->
<canvas id="out"></canvas>
<video id="cam" autoplay playsinline muted></video>
<canvas id="cv"></canvas>
<script>
(async () => {
  const q = new URLSearchParams(location.search);
  const server = (q.get('server') || 'http://127.0.0.1:7860').replace(/\/$/, '');
  const W = +q.get('w') || 512, H = +q.get('h') || 768, quality = +q.get('q') || 0.85;
  const out = document.getElementById('out'), cam = document.getElementById('cam'), cv = document.getElementById('cv');
  const fitContain = (q.get('fit') || 'cover') === 'contain';
  const mirror = (q.get('mirror') ?? '1') !== '0';
  cv.width = W; cv.height = H; const ctx = cv.getContext('2d', {alpha: false});
  const log = (...a) => console.log('[booth]', ...a);

  // --- camera: portrait cover-crop of whatever the camera gives (a landscape Brio included)
  async function openCamera() {
    let deviceId;
    const want = q.get('cam');
    if (want) {
      const devs = (await navigator.mediaDevices.enumerateDevices()).filter(d => d.kind === 'videoinput');
      const hit = devs.find(d => d.label.toLowerCase().includes(want.toLowerCase()));
      if (hit) deviceId = hit.deviceId;
    }
    const constraints = {video: {width: {ideal: 1920}, height: {ideal: 1080}, frameRate: {ideal: 30}, ...(deviceId ? {deviceId: {exact: deviceId}} : {})}, audio: false};
    cam.srcObject = await navigator.mediaDevices.getUserMedia(constraints);
    await new Promise(r => cam.onloadedmetadata = r);
    const t = cam.srcObject.getVideoTracks()[0].getSettings();
    log('camera', t.width + 'x' + t.height + '@' + t.frameRate, cam.srcObject.getVideoTracks()[0].label);
  }
  function grab() {
    const vw = cam.videoWidth, vh = cam.videoHeight; if (!vw) return null;
    const s = Math.max(W / vw, H / vh), sw = W / s, sh = H / s;   // cover-crop, centred
    ctx.drawImage(cam, (vw - sw) / 2, (vh - sh) / 2, sw, sh, 0, 0, W, H);
    return new Promise(res => cv.toBlob(res, 'image/jpeg', quality));
  }

  // --- output: MJPEG bytes → JPEG blobs → ImageBitmap → canvas (cover/contain + mirror), latest frame wins
  const octx = out.getContext('2d', {alpha: false});
  function sizeCanvas() {
    const dpr = window.devicePixelRatio || 1;
    out.width = Math.round(window.innerWidth * dpr); out.height = Math.round(window.innerHeight * dpr);
    octx.fillStyle = '#000'; octx.fillRect(0, 0, out.width, out.height);
  }
  sizeCanvas(); window.addEventListener('resize', sizeCanvas);
  let pending = null, drawing = false, framesDrawn = 0;
  async function drawLatest() {
    if (drawing) return; drawing = true;
    while (pending) {
      const blob = pending; pending = null;
      try {
        const bmp = await createImageBitmap(blob);
        const cw = out.width, ch = out.height, iw = bmp.width, ih = bmp.height;
        const s = fitContain ? Math.min(cw / iw, ch / ih) : Math.max(cw / iw, ch / ih);
        const dw = iw * s, dh = ih * s, dx = (cw - dw) / 2, dy = (ch - dh) / 2;
        if (fitContain) { octx.fillStyle = '#000'; octx.fillRect(0, 0, cw, ch); }
        octx.save();
        if (mirror) { octx.translate(cw, 0); octx.scale(-1, 1); }
        octx.drawImage(bmp, dx, dy, dw, dh);
        octx.restore(); bmp.close(); framesDrawn++;
      } catch (e) { /* truncated JPEG at a reconnect: skip it */ }
    }
    drawing = false;
  }
  let streamAbort = null;
  async function pumpStream(uid) {
    if (streamAbort) streamAbort.abort();
    const ac = new AbortController(); streamAbort = ac;
    try {
      const r = await fetch(`${server}/api/stream/${uid}`, {signal: ac.signal, cache: 'no-store'});
      const reader = r.body.getReader();
      let buf = new Uint8Array(0);
      for (;;) {
        const {value, done} = await reader.read(); if (done) break;
        const nb = new Uint8Array(buf.length + value.length); nb.set(buf); nb.set(value, buf.length); buf = nb;
        // JPEG parts: FF D8 … FF D9 (FF D9 never occurs inside entropy-coded data)
        for (;;) {
          let soi = -1; for (let i = 0; i + 1 < buf.length; i++) if (buf[i] === 0xFF && buf[i + 1] === 0xD8) { soi = i; break; }
          if (soi < 0) { buf = new Uint8Array(0); break; }
          let eoi = -1; for (let i = soi + 2; i + 1 < buf.length; i++) if (buf[i] === 0xFF && buf[i + 1] === 0xD9) { eoi = i + 2; break; }
          if (eoi < 0) { if (soi > 0) buf = buf.slice(soi); break; }
          pending = new Blob([buf.slice(soi, eoi)], {type: 'image/jpeg'}); buf = buf.slice(eoi);
          lastFrameAt = performance.now(); drawLatest();
        }
      }
    } catch (e) { if (e.name !== 'AbortError') log('stream ended', e.message || e); }
  }

  // --- engine session: one websocket + one MJPEG stream, forever
  const resolutionLabel = `${W}x${H}`;
  let ws, lastFrameAt = 0, watchdog;
  function connect() {
    const uid = crypto.randomUUID();
    const wsUrl = server.replace(/^http/, 'ws') + '/api/ws/' + uid;
    ws = new WebSocket(wsUrl);
    ws.onopen = () => log('ws open', uid);
    ws.onmessage = async (ev) => {
      let m; try { m = JSON.parse(ev.data); } catch { return; }
      if (m.status === 'connected') {
        pumpStream(uid); lastFrameAt = performance.now();
      } else if (m.status === 'send_frame') {
        lastFrameAt = performance.now();
        const blob = await grab(); if (!blob || ws.readyState !== 1) return;
        ws.send(JSON.stringify({status: 'next_frame'}));
        ws.send(JSON.stringify({resolution: resolutionLabel, width: W, height: H}));
        ws.send(blob);
      } else if (m.status === 'timeout' || m.status === 'error') {
        log('server says', m.status, m.message || ''); ws.close();
      }
    };
    ws.onerror = () => {};
    ws.onclose = () => { log('ws closed — retry in 2 s'); if (streamAbort) streamAbort.abort(); clearInterval(watchdog); setTimeout(connect, 2000); };
    clearInterval(watchdog);
    watchdog = setInterval(() => {   // engine stalled (no send_frame for 8 s) → reconnect
      if (ws.readyState === 1 && lastFrameAt && performance.now() - lastFrameAt > 8000) { log('stall watchdog'); ws.close(); }
    }, 2000);
  }

  try { await openCamera(); } catch (e) { log('camera failed', e); setTimeout(() => location.reload(), 5000); return; }
  connect();
  window.__booth = {get server() { return server; }, get ws() { return ws; }, get frames() { return framesDrawn; }};
})();
</script>
</body></html>
